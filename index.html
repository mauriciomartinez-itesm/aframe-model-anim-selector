<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showcase: Componente model-anim-selector</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- Componente personalizado -->
  <script src="model-anim-selector.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* Panel de control minimalista */
    .controls-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(20, 20, 25, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 14px 18px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .controls-title {
      font-size: 14px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 6px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-group label {
      font-size: 12px;
      color: #aaa;
      font-weight: 600;
    }

    .field-group select {
      padding: 6px 8px;
      background: #111;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .field-group select:focus {
      border-color: #3b82f6;
    }
  </style>
</head>
<body>

  <!-- Controles mínimos para probar el componente -->
  <div class="controls-panel">
    <div class="controls-title">model-anim-selector</div>

    <div class="field-group">
      <label for="select-model">Modelo (ID / Parte):</label>
      <select id="select-model">
        <option value="Ropa1" selected>Ropa1</option>
        <option value="Ropa2">Ropa2</option>
        <option value="Ropa3">Ropa3</option>
      </select>
    </div>

    <div class="field-group">
      <label for="select-clip">Animación NLA:</label>
      <select id="select-clip">
        <option value="Iddle" selected>Iddle</option>
        <option value="CaminandoAdelante">CaminandoAdelante</option>
        <option value="CaminandoLado">CaminandoLado</option>
      </select>
    </div>
  </div>

  <!-- Escena A-Frame -->
  <a-scene background="color: #202025">
    <!-- Iluminación -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.8;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.2;" position="2 4 3"></a-entity>

    <!-- Suelo simple de referencia -->
    <a-plane rotation="-90 0 0" width="10" height="10" color="#2b2b30"></a-plane>

    <!-- Entidad usando el componente con Personaje.glb -->
    <a-entity
      id="personaje"
      position="0 0 -2.4"
      model-anim-selector="src: Personaje.glb; model: Ropa1; clip: Iddle;">
    </a-entity>

    <!-- Cámara por defecto ubicada frente al personaje -->
    <a-camera position="0 1.0 0"></a-camera>
  </a-scene>

  <script>
    // Enlace directo entre los selects y el componente
    const entity = document.getElementById('personaje');
    const selectModel = document.getElementById('select-model');
    const selectClip = document.getElementById('select-clip');

    selectModel.addEventListener('change', (e) => {
      entity.setAttribute('model-anim-selector', 'model', e.target.value);
    });

    selectClip.addEventListener('change', (e) => {
      entity.setAttribute('model-anim-selector', 'clip', e.target.value);
    });
  </script>
</body>
</html>
